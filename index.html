<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Forest Benchmark</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- ============ Loading screen ============ -->
  <div id="loading-screen">
    <div class="loading-box">
      <h1>Forest Benchmark</h1>
      <div id="loading-text">Loading assets... 0%</div>
      <div class="progress"><div id="loading-bar"></div></div>
      <ul id="loading-errors"></ul>
      <button id="loading-continue" hidden>Continue with placeholder models</button>
    </div>
  </div>

  <button id="panel-toggle" title="Show / hide dashboard">&#9776;</button>

  <!-- ============ Floating dashboard ============ -->
  <aside id="dashboard">
    <header class="dash-header">
      <h2>Forest Benchmark</h2>
      <div id="mode-badge" class="badge baseline">Mode: BASELINE</div>
    </header>
    <div id="active-list" class="muted small"></div>
    <div id="busy" class="busy" hidden></div>

    <!-- A. PERFORMANCE MONITOR -->
    <section>
      <h3>Performance</h3>
      <div id="perf-grid" class="stat-grid"></div>
      <canvas id="fps-graph" width="300" height="70"></canvas>
      <div class="muted tiny">FPS history, last ~60 s (sampled 4x per second)</div>
    </section>

    <!-- B. SCENE CONTROLS -->
    <section>
      <h3>Scene</h3>
      <div id="sliders"></div>
      <div id="rebuild-info" class="muted tiny"></div>
      <div id="asset-status" class="asset-status"></div>
    </section>

    <!-- C. OPTIMIZATION TECHNIQUES -->
    <section>
      <h3>Optimization Techniques</h3>
      <div id="opt-list"></div>
      <div class="row">
        <label for="texture-level">Texture level (when enabled)</label>
        <select id="texture-level" class="lockable">
          <option value="high">High (2K)</option>
          <option value="medium" selected>Medium (1K)</option>
          <option value="low">Low (512)</option>
        </select>
      </div>
      <div class="btn-row">
        <button id="btn-baseline" class="lockable">Baseline</button>
        <button id="btn-optimized" class="lockable">Optimized</button>
      </div>
      <div id="preset-info" class="muted tiny"></div>
    </section>

    <!-- D. BENCHMARK -->
    <section>
      <h3>Benchmark</h3>
      <div class="row">
        <label for="bench-duration">Benchmark Duration (s)</label>
        <input type="number" id="bench-duration" class="lockable num" min="1" max="600" step="1" value="10">
      </div>
      <label class="check"><input type="checkbox" id="bench-camera" class="lockable" checked>
        <span>Fixed camera orbit during benchmark</span></label>
      <div class="btn-row">
        <button id="btn-start" class="primary">Start Benchmark</button>
        <button id="btn-rebuild" class="lockable">Reset / Rebuild Scene</button>
      </div>
      <div id="bench-progress" class="progress small-progress" hidden><div id="bench-bar"></div></div>
      <div id="bench-status" class="muted tiny"></div>
      <div id="results"></div>
      <div class="btn-row">
        <button id="btn-csv" disabled>Download CSV</button>
        <button id="btn-clear" disabled>Clear results</button>
      </div>
    </section>

    <section>
      <h3>Notes</h3>
      <div id="messages" class="messages"></div>
    </section>
  </aside>

  <script type="module" src="main.js"></script>
</body>
</html>
